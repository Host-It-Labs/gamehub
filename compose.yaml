services:
  gamehub:
    image: ghcr.io/host-it-labs/gamehub:0.1.1
    restart: unless-stopped
    init: true
    ports:
      - '${GAMEHUB_PORT:-3492}:8080'
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public Gamehub URL}
      DATABASE_PATH: /data/gamehub.sqlite
    volumes:
      - gamehub-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  gamehub-data:
