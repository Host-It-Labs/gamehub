version = 1
name = "Gamehub"

[setup]
script = "npm ci --no-audit --no-fund"

# Same entry point as the Harness workspace action (.agents/actions.json), so the
# port reclaim and dev stack are defined in exactly one place.
[[actions]]
name = "Start local environment"
icon = "run"
command = "scripts/env/start.sh"
